<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudioFlow</title>
    <script>
      (function() {
        // SPA Fallback redirect handler: redirects any 404 hit back to index.html with query parameter
        try {
          var pathname = window.location.pathname || '/';
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var redirectTarget = '/?p=' + encodeURIComponent(pathname + search + hash);
          window.location.replace(redirectTarget);
        } catch (e) {
          window.location.replace('/');
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .loader {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.2);
        border-radius: 50%;
        border-top-color: #a855f7;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="loader"></div>
      <p style="font-size: 14px; font-weight: 600; letter-spacing: 0.5px;">Carregando StudioFlow...</p>
    </div>
  </body>
</html>
